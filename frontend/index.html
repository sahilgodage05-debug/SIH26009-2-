<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOIL Interactive Mining Map Dashboard</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex;
            height: 100vh;
            background-color: #1a1a2e;
            color: #fff;
        }
        
        /* Map Container */
        #map { 
            width: 70%; 
            height: 100%; 
        }
        
        /* Sidebar Dashboard */
        #sidebar {
            width: 30%;
            height: 100%;
            background-color: #16213e;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            border-left: 2px solid #0f3460;
        }
        
        h1 { color: #e94560; font-size: 24px; text-align: center; margin-top: 0;}
        h2 { color: #fff; font-size: 20px; border-bottom: 1px solid #0f3460; padding-bottom: 5px;}
        
        .score-card {
            background-color: #0f3460;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .score-val { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .score-safe { color: #4ecca3; }
        .score-warning { color: #f2a365; }
        .score-critical { color: #e94560; }
        
        .equipment-card {
            background: #1a1a2e;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid;
            font-size: 14px;
        }
        
        .eq-active { border-color: #4ecca3; }
        .eq-maintenance { border-color: #e94560; }
        .eq-idle { border-color: #f2a365; }
        
        .loading { text-align: center; font-style: italic; color: #888; }
        
        /* Custom map popup styling */
        .leaflet-popup-content-wrapper { background: #16213e; color: #fff; border-radius: 5px;}
        .leaflet-popup-tip { background: #16213e; }
    </style>
</head>
<body>

    <!-- 2D Map -->
    <div id="map"></div>
    
    <!-- Sidebar -->
    <div id="sidebar">
        <h1>MOIL Intelligence</h1>
        <p style="text-align:center; color:#888;">Click on a red Mine marker on the map to view live AI intelligence & equipment data.</p>
        
        <div id="dashboard-content" style="display:none;">
            <h2 id="mine-title">Mine Name</h2>
            
            <div class="score-card">
                <div>Operational Safety Score</div>
                <div id="safety-score" class="score-val">0%</div>
                <div id="safety-status" style="font-weight:bold;">Status</div>
                <p id="safety-rec" style="font-size:12px; color:#aaa; margin-top:10px;"></p>
            </div>
            
            <h2>Live Equipment Status</h2>
            <div id="equipment-list">
                <!-- Equipment cards will load here -->
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    
    <script>
        // Initialize Map centered on Central India (MP/Maharashtra border)
        const map = L.map('map').setView([21.5, 79.5], 8);
        
        // Add Esri Dark Gray Base Map Tiles (Completely Free, No API Key needed)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
            maxZoom: 16
        }).addTo(map);

        // Custom red marker icon
        const mineIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // Fetch Mine Locations and Plot on Map
        async function loadMines() {
            try {
                const res = await fetch('http://localhost:5000/api/mines/locations');
                const mines = await res.json();
                
                mines.forEach(mine => {
                    const marker = L.marker([mine.latitude, mine.longitude], {icon: mineIcon}).addTo(map);
                    marker.bindPopup(`<b>${mine.name}</b><br>${mine.type}<br>Workers: ${mine.workers || 'N/A'}`);
                    
                    // On Click: Load Data into Sidebar
                    marker.on('click', () => {
                        loadMineIntelligence(mine.name, mine.workers);
                    });
                });
            } catch (err) {
                console.error("Failed to load mines:", err);
            }
        }
        
        // Fetch AI Safety Score and Equipment Data for a specific mine
        async function loadMineIntelligence(mineName, workersCount) {
            document.getElementById('dashboard-content').style.display = 'block';
            document.getElementById('mine-title').innerHTML = `${mineName} <div style="font-size:14px; color:#aaa; margin-top:5px; font-weight:normal;">Workers: ${workersCount || 'N/A'}</div>`;
            
            const eqList = document.getElementById('equipment-list');
            eqList.innerHTML = '<div class="loading">Fetching Live Data from AI Backend...</div>';
            
            try {
                // 1. Fetch Safety Score
                const safetyRes = await fetch(`http://localhost:5000/api/mine/${mineName}/safety`);
                const safetyData = await safetyRes.json();
                
                const scoreElem = document.getElementById('safety-score');
                scoreElem.innerText = safetyData.score + '%';
                document.getElementById('safety-status').innerText = safetyData.status;
                document.getElementById('safety-rec').innerText = safetyData.recommendation;
                
                // Color coding based on score
                scoreElem.className = 'score-val';
                if(safetyData.score >= 80) scoreElem.classList.add('score-safe');
                else if(safetyData.score >= 50) scoreElem.classList.add('score-warning');
                else scoreElem.classList.add('score-critical');
                
                // 2. Fetch Equipment List
                const eqRes = await fetch(`http://localhost:5000/api/equipment/${mineName}`);
                const eqData = await eqRes.json();
                
                eqList.innerHTML = '';
                eqData.forEach(eq => {
                    let borderClass = eq.status === 'Active' ? 'eq-active' : (eq.status === 'Idle' ? 'eq-idle' : 'eq-maintenance');
                    
                    // Live Sensor Data Logic (For Balaghat and others if available)
                    let sensorHtml = '';
                    if (eq.engine_temperature && eq.vibration_level) {
                        let tempColor = eq.engine_temperature > 90 ? '#e94560' : '#4ecca3';
                        let vibColor = eq.vibration_level > 5 ? '#e94560' : '#4ecca3';
                        sensorHtml += `
                        <div style="margin-top:8px; padding-top:8px; border-top:1px solid #333; display: flex; justify-content: space-between;">
                            <div>
                                <div style="font-size:12px; color:#aaa;">Engine Temp</div>
                                <div style="font-size:14px; font-weight:bold; color:${tempColor};" class="temp-text" data-id="${eq.machine_id}" data-val="${eq.engine_temperature}">${eq.engine_temperature}°C</div>
                            </div>
                            <div>
                                <div style="font-size:12px; color:#aaa;">Vibration</div>
                                <div style="font-size:14px; font-weight:bold; color:${vibColor};" class="vib-text" data-id="${eq.machine_id}" data-val="${eq.vibration_level}">${eq.vibration_level} mm/s</div>
                            </div>
                        </div>`;
                    }

                    // Fuel Data Logic
                    if (eq.has_fuel_sensor && eq.fuel_capacity) {
                        let fuelPercentage = ((eq.current_fuel_level / eq.fuel_capacity) * 100).toFixed(1);
                        let fuelColor = fuelPercentage < 15 ? '#e94560' : (fuelPercentage < 40 ? '#f2a365' : '#4ecca3');
                        sensorHtml += `
                        <div style="margin-top:8px; padding-top:8px; border-top:1px solid #333;">
                            <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                                <span style="font-size:12px; color:#aaa;">Fuel Level</span>
                                <span style="font-size:12px; font-weight:bold; color:${fuelColor};" class="fuel-text" data-id="${eq.machine_id}" data-current="${eq.current_fuel_level}" data-cap="${eq.fuel_capacity}">${fuelPercentage}% (${eq.current_fuel_level}L)</span>
                            </div>
                            <div style="width:100%; background:#333; height:6px; border-radius:3px; overflow:hidden;">
                                <div class="fuel-bar" data-id="${eq.machine_id}" style="width:${fuelPercentage}%; background:${fuelColor}; height:100%; transition: width 1s linear;"></div>
                            </div>
                        </div>`;
                    }
                    
                    eqList.innerHTML += `
                        <div class="equipment-card ${borderClass}">
                            <div style="font-weight:bold; color:#4ecca3;">${eq.machine_id}</div>
                            <div style="color:#aaa;">${eq.type} | ${eq.capacity}</div>
                            <div style="margin-top:5px;">Health: ${eq.health_score}% | Status: ${eq.status}</div>
                            ${sensorHtml}
                        </div>
                    `;
                });
                
                // Simulate Live Telemetry (Drain fuel, fluctuate temp/vib)
                if (window.liveInterval) clearInterval(window.liveInterval);
                window.liveInterval = setInterval(() => {
                    // Fuel
                    document.querySelectorAll('.fuel-text').forEach(el => {
                        let current = parseFloat(el.getAttribute('data-current'));
                        let cap = parseFloat(el.getAttribute('data-cap'));
                        if (current > 5) {
                            current -= 0.5;
                            el.setAttribute('data-current', current.toFixed(1));
                            let pct = ((current / cap) * 100).toFixed(1);
                            let color = pct < 15 ? '#e94560' : (pct < 40 ? '#f2a365' : '#4ecca3');
                            el.innerText = `${pct}% (${current.toFixed(1)}L)`;
                            el.style.color = color;
                            let bar = document.querySelector(`.fuel-bar[data-id="${el.getAttribute('data-id')}"]`);
                            if (bar) { bar.style.width = `${pct}%`; bar.style.background = color; }
                        }
                    });

                    // Temp
                    document.querySelectorAll('.temp-text').forEach(el => {
                        let val = parseFloat(el.getAttribute('data-val'));
                        val += (Math.random() - 0.5) * 1.5; // Fluctuate by +/- 0.75
                        el.setAttribute('data-val', val.toFixed(1));
                        el.innerText = `${val.toFixed(1)}°C`;
                        el.style.color = val > 90 ? '#e94560' : '#4ecca3';
                    });

                    // Vibration
                    document.querySelectorAll('.vib-text').forEach(el => {
                        let val = parseFloat(el.getAttribute('data-val'));
                        val += (Math.random() - 0.5) * 0.4; // Fluctuate by +/- 0.2
                        val = Math.max(0.1, val); // Prevent negative
                        el.setAttribute('data-val', val.toFixed(1));
                        el.innerText = `${val.toFixed(1)} mm/s`;
                        el.style.color = val > 5 ? '#e94560' : '#4ecca3';
                    });
                }, 2000);
                
            } catch (err) {
                console.error("Error loading intelligence:", err);
                eqList.innerHTML = '<div class="loading" style="color:#e94560;">Error connecting to Backend.</div>';
            }
        }

        // Initialize Map Points
        loadMines();
    </script>
</body>
</html>
